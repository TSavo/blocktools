[package]
name = "blocktools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools library. DANGEROUS: use at your own risk. Code that handles keys and signs transactions should always be read and audited by you before you trust it with real funds. Used incorrectly, it can destroy your money."
[dependencies]
blocktools-monero = { version = "0.3.2", path = "../monero", default-features = false }
bitcoin.workspace = true
sha3.workspace = true
groestl.workspace = true
zeroize.workspace = true
ed25519-dalek = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
bip39 = { workspace = true, optional = true }
schnorrkel = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
[features]
# Solana / ed25519 addresses. Off by default so dat-read & co. stay small.
ed25519 = ["dep:ed25519-dalek"]
# APIs that take or emit private keys (WIF/hex rows, xprv derivation). Off by default.
secrets = []
# Algorand 25-word mnemonic (BIP39 English word list).
algo = ["dep:bip39"]
# Polkadot sr25519 (substrate mini-secret from BIP39 entropy).
# Cardano Icarus master key (BIP39 entropy) + BIP32-Ed25519 (CIP-1852) derivation.
cardano = ["dep:bip39", "dep:pbkdf2", "dep:sha2", "dep:curve25519-dalek"]
# TON native 24-word mnemonic.
ton = ["dep:bip39", "dep:pbkdf2", "dep:sha2"]
sr25519 = ["dep:schnorrkel", "dep:bip39", "dep:pbkdf2", "dep:sha2"]

[dev-dependencies]
blocktools-schema = { version = "0.3.2", path = "../schema" }
