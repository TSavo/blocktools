[package]
name = "blocktools-tx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools transaction decode/build/sign library (offline). DANGEROUS: use at your own risk. Code that handles keys and signs transactions should always be read and audited by you before you trust it with real funds. Used incorrectly, it can destroy your money."
[dependencies]
bitcoin.workspace = true
secp256k1 = { workspace = true, features = ["recovery"] }
sha3.workspace = true
serde_json.workspace = true
blocktools-core = { version = "0.1.0", path = "../core" }
[features]
# Signing APIs (take private keys). Off by default; tx-sign enables it.
secrets = ["blocktools-core/secrets"]

[[test]]
name = "sign"
required-features = ["secrets"]

[[test]]
name = "twc_evm"
required-features = ["secrets"]

[[test]]
name = "grs"
required-features = ["secrets"]
