[package]
name = "blocktools-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools secret-handling library: seeds, wallet files, keystores, private keys. DANGEROUS: use at your own risk. Code that handles keys should always be read and audited by you before you trust it with real funds."
[dependencies]
blocktools-core = { path = "../core", features = ["secrets"], optional = true }
bip39 = { workspace = true, optional = true }
bitcoin = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
zeroize.workspace = true
pbkdf2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha3 = { workspace = true, optional = true }
scrypt = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
ctr = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
[features]
# One feature per area so each CLI links only the crypto it uses (deps/*.allow stay small).
repair = ["dep:bip39"]
seed = ["dep:blocktools-core", "dep:bitcoin", "dep:bip39", "dep:pbkdf2", "dep:sha2"]
dat = ["dep:blocktools-core", "dep:bitcoin", "dep:aes", "dep:cbc"]
keystore = ["dep:blocktools-core", "dep:bitcoin", "dep:aes", "dep:ctr", "dep:pbkdf2", "dep:scrypt", "dep:serde_json", "dep:sha2", "dep:sha3"]
keys = ["dep:blocktools-core", "dep:bitcoin", "dep:serde_json"]
algo = ["keys", "blocktools-core/algo"]
ton = ["keys", "blocktools-core/ton"]
sr25519 = ["keys", "blocktools-core/sr25519"]
multibit = ["dep:blocktools-core", "dep:bitcoin", "dep:aes", "dep:cbc", "dep:md-5", "dep:scrypt"]
electrum = ["dep:blocktools-core", "dep:bitcoin", "dep:aes", "dep:cbc", "dep:serde_json"]
walk = ["dep:blocktools-core", "dep:bitcoin"]
ed25519 = ["blocktools-core?/ed25519"]
[dev-dependencies]
bip39.workspace = true
blocktools-schema = { path = "../schema" }
