[package]
name = "blocktools-plan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal declarative transaction representation (IR) across chain families. DANGEROUS: audit before trusting with funds. See RFC https://github.com/TSavo/blocktools/issues/15."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
blocktools-core = { version = "0.3.3", path = "../core", default-features = false }
blocktools-evm = { version = "0.3.3", path = "../evm" }
blocktools-tx = { version = "0.3.3", path = "../tx" }
blocktools-acct = { version = "0.3.3", path = "../acct", optional = true }
blocktools = { version = "0.3.3", path = "../blocktools" }
bitcoin = { workspace = true }

[features]
# The Account family (THORChain/Cosmos SignDocs) needs blocktools-acct (ed25519/sr25519 crates), so it is
# a default feature the CLIs keep and the wasm binding (bindings/wasm) leaves off.
default = ["account"]
account = ["dep:blocktools-acct"]

[[test]]
name = "account_golden"
required-features = ["account"]
