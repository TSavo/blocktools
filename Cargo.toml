[workspace]
resolver = "2"
exclude = ["bindings/wasm"]
members = ["crates/schema", "crates/core", "crates/io", "crates/tty", "crates/secrets", "crates/blocktools", "tools/redact", "tools/sealed-run", "tools/read-file", "tools/seed-repair", "tools/seed-to-master", "tools/derive", "tools/keystore-open", "tools/dat-read", "tools/key-to-addresses", "crates/tx", "crates/monero", "crates/xrp", "crates/acct", "tools/acct-tx", "tools/tx-decode", "tools/tx-build", "tools/tx-verify", "tools/tx-sign", "crates/net", "tools/utxo-fetch", "tools/tx-broadcast", "tools/classify", "tools/electrum-read", "tools/multibit-read", "tools/armory-read", "tools/xmr-keys", "tools/xrp-tx", "tools/xpub-addresses", "tools/zec-sapling", "tools/xmr-wallet", "tools/chain-table", "tools/pw-candidates", "tools/bip38-open", "tools/blockchain-read", "crates/cabi", "tools/tx-envelope", "crates/evm", "tools/sig-hash", "tools/abi-decode", "tools/abi-encode"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }
minreq = { version = "2.14", default-features = false, features = ["https-rustls"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
bip39 = { version = "2.1", default-features = false, features = ["std"] }
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
secp256k1 = { version = "0.29", default-features = false, features = ["std"] }
sha3 = { version = "0.10", default-features = false }
scrypt = { version = "0.12", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
sha-1 = { version = "0.10", default-features = false }
groestl = { version = "0.10", default-features = false }
aes = "0.8"
md-5 = { version = "0.10", default-features = false }
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
schnorrkel = { version = "0.11", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[profile.release]
panic = "abort"
strip = true
lto = true
