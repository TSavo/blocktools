[workspace]
resolver = "2"
members = ["crates/kr-schema", "tools/kr-redact", "tools/seed-repair", "tools/derive", "tools/keystore-open"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
bip39 = "2.1"
bitcoin = "0.32"
sha3 = "0.10"
hex = "0.4"
scrypt = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
regex = "1"

[profile.release]
panic = "abort"
strip = true
lto = true
