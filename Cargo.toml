[workspace]
resolver = "2"
members = ["crates/kr-schema", "crates/kr-core", "crates/kr-io", "tools/kr-redact", "tools/kr-run", "tools/kr-cat", "tools/seed-repair", "tools/seed-to-master", "tools/derive", "tools/keystore-open", "tools/dat-read", "tools/key-to-addresses"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
bip39 = { version = "2.1", default-features = false, features = ["std"] }
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
secp256k1 = { version = "0.29", default-features = false, features = ["std"] }
sha3 = { version = "0.10", default-features = false }
scrypt = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[profile.release]
panic = "abort"
strip = true
lto = true
