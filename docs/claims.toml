[[claim]]
id = "fee-cap-evm-default"
statement = "With no --max-fee, every signing route caps EVM total fee at 0.01 ETH-equivalent"
kind = "security"
platform = "linux"
status = "measured"
command = "cargo test -q --release -p blocktools --test fee_cap_paths"
expect = "test result: ok"
commit = "3ec1d1a"
date = "2026-10-25"
cheap = false
depends = ["crates/tx/src/policy.rs"]
doc = [{ file = "DESIGN.md", text = "0.01 ETH" }, { file = "EXPORTS.md", text = "0.01 ETH" }, { file = "docs/SECURITY.md", text = "0.01 ETH" }, { file = "docs/EXPORTS-reference.md", text = "0.01 ETH" }]

