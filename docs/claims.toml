# Claims registry: the single source for every quantitative/security/platform claim in the docs.
# Schema and rules: scripts/claims-check.py (docs-check rule 12). Render docs/CLAIMS.md with --render.

[[claim]]
id = "fee-cap-evm-default"
statement = "With no --max-fee, every signing route caps EVM total fee at 0.01 ETH-equivalent"
kind = "security"
platform = "linux"
status = "measured"
command = "cargo test -q --release -p blocktools --test fee_cap_paths"
expect = "test result: ok"
commit = "3ec1d1a"
date = "2026-10-25"
cheap = false
depends = ["crates/tx/src/policy.rs"]
doc = [{ file = "DESIGN.md", text = "0.01 ETH" }, { file = "EXPORTS.md", text = "0.01 ETH" }, { file = "docs/SECURITY.md", text = "0.01 ETH" }]

[[claim]]
id = "fee-cap-utxo-default"
statement = "With no --max-fee, every signing route caps UTXO fee at max(100,000 base units, chain rate limit x vsize); 35 of 35 corpus sweeps pass (flat cap refused 9 of 35); cap+1 refused on each of 27 buildable chains; 240,000 sat on a 1-input BTC tx refused"
kind = "security"
platform = "linux"
status = "measured"
command = "cargo test -q --release -p blocktools-tx --test fee_cap_chains"
expect = "test result: ok. 4 passed"
commit = "c381ec3"
date = "2026-10-25"
cheap = false
depends = ["crates/tx/src/policy.rs", "crates/core/src/chains.rs", "crates/tx/tests/fee_cap_chains.rs", "crates/tx/tests/data/feeprobe-corpus.jsonl"]
doc = [{ file = "docs/CHAINS.md", text = "100,000 sat" }, { file = "docs/CHAINS.md", text = "35 legitimate sweeps" }, { file = "docs/CHAINS.md", text = "9 of 35" }, { file = "docs/CHAINS.md", text = "27 buildable chains" }, { file = "docs/CHAINS.md", text = "240,000 sat" }]

[[claim]]
id = "scrypt-bounds"
statement = "Keystore scrypt is bounded by 128*N*r <= 256 MiB and N*r*p <= 2^24; a hostile 8 GiB request is refused"
kind = "security"
platform = "linux"
status = "measured"
command = "cargo test -q --release -p blocktools-secrets --all-features -- scrypt_bounds hostile_kdf"
expect = "test result: ok. 2 passed"
commit = "fbcf2b3"
date = "2026-10-25"
cheap = false
depends = ["crates/secrets/src/keystore.rs"]
doc = [{ file = "DESIGN.md", text = "256 MiB" }, { file = "docs/SECURITY.md", text = "256 MiB" }, { file = "docs/SECURITY.md", text = "8 GiB" }]

