[package]
name = "msg-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools msg-sign: sign a text message (Ethereum personal_sign / Bitcoin signmessage) after a human-typed confirmation code. DANGEROUS: use at your own risk. Code that handles keys and signs transactions should always be read and audited by you before you trust it with real funds. Used incorrectly, it can destroy your money."
[dependencies]
blocktools-tx = { version = "0.3.0", path = "../../crates/tx", features = ["secrets"] }
blocktools-secrets = { version = "0.3.0", path = "../../crates/secrets", features = ["keys"] }
blocktools-io = { version = "0.3.0", path = "../../crates/io" }
blocktools-core = { version = "0.3.0", path = "../../crates/core", features = ["secrets"] }
blocktools-tty = { version = "0.3.0", path = "../../crates/tty" }
serde_json.workspace = true
bitcoin.workspace = true
zeroize.workspace = true
