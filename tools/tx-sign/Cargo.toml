[package]
name = "tx-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools tx-sign: sign after a human-typed confirmation code. DANGEROUS: use at your own risk. Code that handles keys and signs transactions should always be read and audited by you before you trust it with real funds. Used incorrectly, it can destroy your money."
[dependencies]
blocktools-plan = { version = "0.3.2", path = "../../crates/plan" }
blocktools-evm = { version = "0.3.2", path = "../../crates/evm" }
blocktools-tx = { version = "0.3.2", path = "../../crates/tx", features = ["secrets"] }
blocktools-secrets = { version = "0.3.2", path = "../../crates/secrets", features = ["keys"] }
blocktools-io = { version = "0.3.2", path = "../../crates/io" }
serde_json.workspace = true
blocktools-core = { version = "0.3.2", path = "../../crates/core", features = ["secrets"] }
blocktools-tty = { version = "0.3.2", path = "../../crates/tty" }
bitcoin.workspace = true
zeroize.workspace = true
