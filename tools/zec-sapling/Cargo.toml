[package]
name = "zec-sapling"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools zec-sapling: BIP39 mnemonic (stdin) -> ZIP-32 Sapling default addresses (zs1...). Prints no secrets; optional 0600 viewing-key file."
[dependencies]
blocktools-io = { version = "0.3.3", path = "../../crates/io" }
sapling-crypto = { version = "0.7", default-features = false }
zip32 = { version = "0.2", default-features = false }
bip39 = { workspace = true }
bech32 = "0.11"
zeroize = { workspace = true }
zcash_address = { version = "0.12.0", default-features = false }
orchard = { version = "0.15.5", default-features = false }
bitcoin = { workspace = true }
zcash_protocol = { version = "0.9", default-features = false }
