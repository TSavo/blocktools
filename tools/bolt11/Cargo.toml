[package]
name = "bolt11"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blocktools bolt11: decode a BOLT11 Lightning invoice (bech32, tagged fields, recovered payee pubkey) and re-encode it byte-identically. Offline, reads only the public invoice string, holds no key and never signs."
[dependencies]
blocktools-io = { version = "0.3.2", path = "../../crates/io" }
# decode/reencode live in blocktools-tx (tx::bolt11), shared with the wasm bolt11Decode/bolt11Reencode exports.
blocktools-tx = { version = "0.3.2", path = "../../crates/tx" }
serde_json.workspace = true
