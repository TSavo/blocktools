name: ci
on: [push, pull_request]
# Every check lives in scripts/gate.sh (the same script verify-and-push runs locally).
# Other run: lines may only be environment setup listed in scripts/ci-allowed-setup.txt.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }  # findings/claims checks need full history (R2-12)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: rustup target add wasm32-unknown-unknown && cargo install --locked wasm-bindgen-cli --version 0.2.100
      - run: sh scripts/gate.sh
