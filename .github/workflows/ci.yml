name: ci
on: [push, pull_request]
# Read-only token for every job (fork PRs never get secrets or a write token).
permissions:
  contents: read
# One run per ref, newest wins: a push cancels the run of the previous commit on that ref (docs/CI.md, 'Queue').
# Measured before this: pushes every 2.4 min, each run waiting 7-19 min for the previous one to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Every check lives in scripts/gate.sh (the same script verify-and-push runs locally: the lint stage by default, all stages with GATE=full).
# CI runs each stage as a parallel job; ci-gate-check.sh fails unless the matrix equals
# `sh scripts/gate.sh --list`. Other run: lines may only be setup from scripts/ci-allowed-setup.txt.
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, test, negatives, e2e]
    # Self-hosted Battleaxe runner by default (docs/CI.md). Fallback to GitHub-hosted: set repo variable
    # RUNNER_LABELS to '"ubuntu-latest"' (JSON). Repo is public: outside-contributor runs need
    # maintainer approval and would run on this self-hosted runner (Docker socket); see docs/CI.md.
    # Fork pull_request runs (head repo != this repo) always go to GitHub-hosted ubuntu-latest, never Battleaxe;
    # scripts/ci-fork-check.py evaluates this expression for fork / same-repo / push events (rule H-fork).
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-latest"' || vars.RUNNER_LABELS || '["self-hosted","Linux","X64","blocktools"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # fetch-depth 0: findings/claims checks need full history (R2-12). clean false: the default
        # `git clean -ffdx` deleted target/ at the start of every job on the persistent runners, so each
        # job rebuilt the workspace (rust-cache used to put it back from GitHub's cache). The cleanup step
        # at the end of the job removes everything untracked except target/.
        with: { fetch-depth: 0, clean: false }
      # One target/ per ref, shared by the four runner containers through the tool-cache volume: the four
      # jobs of a run compile a commit once (cargo's build-directory lock makes the other three wait for
      # the artifacts), and the next commit on the ref builds incrementally. Per ref, because one run per
      # ref (concurrency above) means no two commits ever build into the same dir at once. docs/CI.md 'Queue'.
      - run: d="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/blocktools-target/$(printf '%s' "$GITHUB_REF" | tr -c 'A-Za-z0-9._-' _)" && mkdir -p "$d" && { [ -L target ] || rm -rf target; } && ln -sfn "$d" target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # GitHub-hosted runners only: the Battleaxe runners keep target/ between jobs (cleanup spares it), and
        # rust-cache's save step alone cost 1.1-2.7 min per Linux job (runs 40388233412..40401710490).
        if: runner.environment == 'github-hosted'
        with: { key: "${{ matrix.stage }}", cache-bin: "true" }
      - run: rustup toolchain install 1.85.1 --profile minimal 2>/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      - run: rustup default 1.85.1 && rustc --version | grep -q '^rustc 1.85.1 '
      - run: sh scripts/ci-require-tools.sh
      - run: (rustup target list --installed | grep -qx wasm32-unknown-unknown || rustup target add wasm32-unknown-unknown) && (wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.100' || cargo install --locked --force wasm-bindgen-cli --version 0.2.100)
      - run: python3 -c 'import cryptography, yaml' 2>/dev/null || python3 -m pip install --user --break-system-packages cryptography pyyaml
      - run: sh scripts/gate.sh ${{ matrix.stage }}
      - if: always()
        run: git worktree prune && git clean -ffdxq -e target && for d in "${TMPDIR:-/tmp}"/blocktools-* "${TMPDIR:-/tmp}"/ci-gate.*; do [ "$d" = "${TMPDIR:-/tmp}/blocktools-wasm-build" ] || rm -rf "$d"; done

  # macOS e2e on a GitHub-hosted runner. claims-check K-macos only accepts a macos claim as measured when
  # this job ("macos") succeeded at the claim's commit. continue-on-error: the known Mac pin-tty failure is
  # still open, and the Linux gate's status must stay meaningful meanwhile.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          cache-bin: true
      - run: (rustup target list --installed | grep -qx wasm32-unknown-unknown || rustup target add wasm32-unknown-unknown) && (wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.100' || cargo install --locked --force wasm-bindgen-cli --version 0.2.100)
      - run: python3 -c 'import cryptography' 2>/dev/null || python3 -m pip install --user --break-system-packages cryptography
      - run: sh scripts/gate.sh e2e
