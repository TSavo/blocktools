name: release
# Tag push v* -> build, test, gate, package linux-x86_64 binaries + SHA256SUMS, publish a GitHub release.
# Then the "repos" job rebuilds the signed Alpine/apt/RPM repositories from that tarball and pushes them to
# gh-pages (versioned from the tag). It runs on the host-side blocktools-signer runner, whose job-started hook
# (scripts/signer-runner-hook.sh) admits only this workflow on a v* tag push or a main workflow_dispatch.
# workflow_dispatch -> same build, artifacts only (no release), and an UNSIGNED repo build (repos-dry-run)
# that signs nothing and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","blocktools"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.1 --profile minimal 2>/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      - run: rustup default 1.85.1 && rustc --version | grep -q '^rustc 1.85.1 '
      - run: sh scripts/ci-require-tools.sh
      # Shipped binaries keep fat LTO (Cargo.toml defaults to thin for developer and gate builds).
      - run: env CARGO_PROFILE_RELEASE_LTO=fat cargo build --locked --release --workspace && env CARGO_PROFILE_RELEASE_LTO=fat cargo test --locked --release --workspace
      - run: sh scripts/check-deps.sh
      - run: sh scripts/secret-scan.sh
      - run: if [ "${GITHUB_REF_TYPE}" = tag ]; then sh scripts/version-check.sh "$GITHUB_REF_NAME"; else sh scripts/version-check.sh; fi
      - name: package
        run: |
          set -eu
          name=blocktools-${GITHUB_REF_NAME}-linux-x86_64
          name=$(echo "$name" | tr '/' '-')
          mkdir -p "dist/$name/bin"
          for f in target/release/*; do
            [ -f "$f" ] && [ -x "$f" ] && case "$f" in *.d|*.so|*.rlib) ;; *) cp "$f" "dist/$name/bin/";; esac
          done
          cp blocktools LICENSE README.md DESIGN.md EXPORTS.md "dist/$name/"
          cp -r recipes "dist/$name/"
          mkdir -p "dist/$name/share/man/man1" "dist/$name/share/man/man7" "dist/$name/man"
          cp man/man1/*.1 "dist/$name/share/man/man1/"
          cp man/man7/*.7 "dist/$name/share/man/man7/"
          cp -r man/man1 "dist/$name/man/"
          cp -r man/man7 "dist/$name/man/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          ls "dist/$name/bin" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
  # Dry-run only: arm64 tarballs as artifacts on workflow_dispatch. Not needed by publish or
  # repos, so nothing here is ever released. Same steps as ci.yml package-macos/package-linux-arm.
  dryrun-macos-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.1 --profile minimal 2>/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      - run: rustup default 1.85.1 && rustc --version | grep -q '^rustc 1.85.1 '
      - run: sh scripts/gate.sh package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dryrun-macos-arm64
          path: dist/*
  dryrun-linux-aarch64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.1 --profile minimal 2>/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.1 && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      - run: rustup default 1.85.1 && rustc --version | grep -q '^rustc 1.85.1 '
      - run: sh scripts/gate.sh package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dryrun-linux-aarch64
          path: dist/*
  release-env:
    # finding:R2-6: refuse to publish unless the "release" environment deploys only from v* tags.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","blocktools"]') }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: sh scripts/release-env-check.sh "$GH_REPO"
  publish:
    # No manual approval (T, 2026-10-26). The "release" environment allows deployments only from
    # tags matching v* (Settings -> Environments -> release -> Deployment branches and tags);
    # release-env checks that policy through the API first and fails closed.
    needs: [build, release-env]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","Linux","X64","blocktools"]') }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-dist, path: dist }
      - env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Linux x86_64 binaries. Verify with: sha256sum -c SHA256SUMS"
  repos:
    # Signed apk/apt/rpm repos on gh-pages, from the same release-dist tarball. Host-side signing:
    # scripts/release-repos.sh -> scripts/{apk,apt,rpm}-sign-host.sh (read-only AppRoles, keys on tmpfs).
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, blocktools-signer]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-dist, path: dist }
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - run: sh scripts/release-repos.sh build "${GITHUB_REF_NAME#v}" dist/blocktools-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz "$RUNNER_TEMP/repos"
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: sh scripts/release-repos.sh publish "$RUNNER_TEMP/repos"
  repos-dry-run:
    # workflow_dispatch on main: build the same packages and repo layout, sign nothing, publish nothing.
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, blocktools-signer]
    permissions:
      contents: read
    env: { REPOS_UNSIGNED: '1' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-dist, path: dist }
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          sh scripts/release-repos.sh build "$v" dist/blocktools-main-linux-x86_64.tar.gz "$RUNNER_TEMP/repos"
