name: release
# Tag push v* -> build, test, gate, package linux-x86_64 binaries + SHA256SUMS, publish a GitHub release.
# workflow_dispatch -> same build, artifacts only (no release), for a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build --locked --release --workspace && cargo test --locked --release --workspace
      - run: sh scripts/check-deps.sh
      - run: sh scripts/secret-scan.sh
      - name: package
        run: |
          set -eu
          name=blocktools-${GITHUB_REF_NAME}-linux-x86_64
          name=$(echo "$name" | tr '/' '-')
          mkdir -p "dist/$name/bin"
          for f in target/release/*; do
            [ -f "$f" ] && [ -x "$f" ] && case "$f" in *.d|*.so|*.rlib) ;; *) cp "$f" "dist/$name/bin/";; esac
          done
          cp blocktools LICENSE README.md DESIGN.md EXPORTS.md "dist/$name/"
          cp -r recipes "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          ls "dist/$name/bin" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
  publish:
    # Manual approval: the "release" environment must have required reviewers (repo Settings ->
    # Environments). Without that protection rule GitHub creates it unprotected on first use.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-dist, path: dist }
      - env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Linux x86_64 binaries. Verify with: sha256sum -c SHA256SUMS"
